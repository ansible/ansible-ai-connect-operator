---
# AAP-93433: operator-managed Secrets must not persist
# kubectl.kubernetes.io/last-applied-configuration (client-side apply leak).
- block:
    - name: Operator-managed secret names created by molecule CRs
      ansible.builtin.set_fact:
        _operator_secret_names:
          - ansibleaiconnect-sample-admin-password
          - ansibleaiconnect-sample-db-fields-encryption-secret
          - ansibleaiconnect-sample-model-pipeline-configuration
          - ansibleaiconnect-sample-postgres-configuration
          - ansiblemcpconnect-sample-telemetry-hmac-secret

    - name: Get operator-managed Secret
      kubernetes.core.k8s_info:
        kind: Secret
        name: "{{ item }}"
        namespace: "{{ namespace }}"
      register: _operator_secrets
      loop: "{{ _operator_secret_names }}"
      loop_control:
        label: "{{ item }}"

    - name: Assert operator-managed secrets exist without last-applied-configuration
      ansible.builtin.assert:
        that:
          - item.resources | default([]) | length == 1
          - (item.resources[0].metadata.annotations | default({}))['kubectl.kubernetes.io/last-applied-configuration'] is not defined
        fail_msg: >-
          Secret {{ item.item }} is missing or still has
          kubectl.kubernetes.io/last-applied-configuration
      loop: "{{ _operator_secrets.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Assert CR-referenced molecule fixture Secrets kept last-applied-configuration
      kubernetes.core.k8s_info:
        kind: Secret
        name: "{{ item }}"
        namespace: "{{ namespace }}"
      register: _fixture_secret
      loop:
        - auth-configuration-secret
        - model-configuration-secret
        - chatbot-configuration-secret
      loop_control:
        label: "{{ item }}"

    - name: Check fixture last-applied-configuration is still present
      ansible.builtin.assert:
        that:
          - item.resources | default([]) | length == 1
          - (item.resources[0].metadata.annotations | default({}))['kubectl.kubernetes.io/last-applied-configuration'] is defined
        fail_msg: >-
          Fixture Secret {{ item.item }} lost
          kubectl.kubernetes.io/last-applied-configuration
      loop: "{{ _fixture_secret.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Snapshot admin-password data before upgrade-cleanup simulation
      kubernetes.core.k8s_info:
        kind: Secret
        name: ansibleaiconnect-sample-admin-password
        namespace: "{{ namespace }}"
      register: _admin_before

    - name: Seed last-applied-configuration on an operator-generated Secret
      kubernetes.core.k8s:
        state: patched
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: ansibleaiconnect-sample-admin-password
            namespace: "{{ namespace }}"
            annotations:
              kubectl.kubernetes.io/last-applied-configuration: '{"kind":"Secret","stringData":{"password":"leaked-from-upgrade"}}'

    - name: Label leftover admin-password Secret with an unrelated kubectl manager
      ansible.builtin.command:
        argv:
          - kubectl
          - label
          - secret
          - ansibleaiconnect-sample-admin-password
          - "--namespace={{ namespace }}"
          - test.aap.ansible.com/strip-probe=1
          - --overwrite
      changed_when: true

    # chatbot-api-key is deleted when chatbot is disabled, so the GitOps
    # copied-label case uses the unused model-mesh default name instead.
    - name: Read model-pipeline-configuration so GitOps fixture can share config
      kubernetes.core.k8s_info:
        kind: Secret
        name: ansibleaiconnect-sample-model-pipeline-configuration
        namespace: "{{ namespace }}"
      register: _pipeline_secret

    - name: Stage GitOps Secret manifest
      ansible.builtin.tempfile:
        suffix: .json
      register: _gitops_manifest

    - name: Write GitOps Secret manifest
      ansible.builtin.copy:
        dest: "{{ _gitops_manifest.path }}"
        content: "{{ _gitops_secret | to_json }}"
      vars:
        _gitops_secret:
          apiVersion: v1
          kind: Secret
          metadata:
            name: ansibleaiconnect-sample-model-mesh-configuration
            namespace: "{{ namespace }}"
            labels:
              app.kubernetes.io/name: ansibleaiconnect-sample
              app.kubernetes.io/part-of: ansibleaiconnect-sample
              app.kubernetes.io/managed-by: ansible-ai-connect-operator
              app.kubernetes.io/component: ansible-ai-connect
          stringData:
            config: "{{ _pipeline_secret.resources[0].data.config | b64decode }}"
      no_log: true

    - name: Apply GitOps Secret with kubectl field manager
      ansible.builtin.command:
        argv:
          - kubectl
          - apply
          - -f
          - "{{ _gitops_manifest.path }}"
      changed_when: true

    - name: Remove GitOps Secret manifest
      ansible.builtin.file:
        path: "{{ _gitops_manifest.path }}"
        state: absent

    - name: Snapshot postgres Secret before custom-manager apply
      kubernetes.core.k8s_info:
        kind: Secret
        name: ansibleaiconnect-sample-postgres-configuration
        namespace: "{{ namespace }}"
      register: _pg_before
      no_log: true

    - name: Decode postgres Secret for custom-manager apply
      ansible.builtin.set_fact:
        _pg_string_data: "{{ _pg_string_data | default({}) | combine({item.key: item.value | b64decode}) }}"
      loop: "{{ _pg_before.resources[0].data | dict2items }}"
      no_log: true

    - name: Stage custom-manager Secret manifest
      ansible.builtin.tempfile:
        suffix: .json
      register: _custom_manifest

    - name: Write custom-manager Secret manifest
      ansible.builtin.copy:
        dest: "{{ _custom_manifest.path }}"
        content: "{{ _custom_secret | to_json }}"
      vars:
        _custom_secret:
          apiVersion: v1
          kind: Secret
          metadata:
            name: ansibleaiconnect-sample-postgres-configuration
            namespace: "{{ namespace }}"
            labels:
              app.kubernetes.io/name: ansibleaiconnect-sample
              app.kubernetes.io/part-of: ansibleaiconnect-sample
              app.kubernetes.io/managed-by: ansible-ai-connect-operator
              app.kubernetes.io/component: ansible-ai-connect
          type: "{{ _pg_before.resources[0].type | default('Opaque') }}"
          stringData: "{{ _pg_string_data }}"
      no_log: true

    - name: Apply postgres Secret with a custom field manager
      ansible.builtin.command:
        argv:
          - kubectl
          - apply
          - --field-manager=custom-manager
          - -f
          - "{{ _custom_manifest.path }}"
      changed_when: true
      no_log: true

    - name: Remove custom-manager Secret manifest
      ansible.builtin.file:
        path: "{{ _custom_manifest.path }}"
        state: absent

    - name: Snapshot db-fields-encryption Secret before managed_by_aap simulation
      kubernetes.core.k8s_info:
        kind: Secret
        name: ansibleaiconnect-sample-db-fields-encryption-secret
        namespace: "{{ namespace }}"
      register: _dbenc_before

    - name: Seed last-applied-configuration and managed_by_aap on db-fields-encryption Secret
      kubernetes.core.k8s:
        state: patched
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: ansibleaiconnect-sample-db-fields-encryption-secret
            namespace: "{{ namespace }}"
            annotations:
              kubectl.kubernetes.io/last-applied-configuration: '{"kind":"Secret","stringData":{"encryption_key":"leaked"}}'
          stringData:
            managed_by_aap: "true"

    - name: Create same-name admin Secret on the MCP CR name
      kubernetes.core.k8s:
        state: present
        apply: true
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: ansiblemcpconnect-sample-admin-password
            namespace: "{{ namespace }}"
          stringData:
            password: mcp-user-admin
      no_log: true

    # ansible-operator v1.42 reconciles on spec generation (and may ignore
    # annotation-only patches). Do not enqueue AnsibleMCPConnect first:
    # maxConcurrentReconciles is 1, and a full MCP playbook can exceed the
    # leftover wait. Strip runs at the start of the AI playbook.
    - name: Trigger AnsibleAIConnect reconcile
      kubernetes.core.k8s:
        state: patched
        api_version: aiconnect.ansible.com/v1alpha1
        kind: AnsibleAIConnect
        name: ansibleaiconnect-sample
        namespace: "{{ namespace }}"
        merge_type: merge
        definition:
          spec:
            extra_settings:
              - setting: APPEND_SLASH
                value: true
            admin_password_secret: ansibleaiconnect-sample-admin-password

    - name: Wait until operator leftover last-applied-configuration is stripped
      kubernetes.core.k8s_info:
        kind: Secret
        name: ansibleaiconnect-sample-admin-password
        namespace: "{{ namespace }}"
      register: _admin_after
      until:
        - _admin_after.resources | default([]) | length == 1
        - (_admin_after.resources[0].metadata.annotations | default({}))['kubectl.kubernetes.io/last-applied-configuration'] is not defined
      retries: 30
      delay: 10

    - name: Assert upgrade cleanup left Secret data unchanged
      ansible.builtin.assert:
        that:
          - _admin_after.resources[0].data.password == _admin_before.resources[0].data.password
        fail_msg: Upgrade cleanup changed ansibleaiconnect-sample-admin-password data

    - name: Get GitOps / managed_by_aap / same-name Secrets after reconcile
      kubernetes.core.k8s_info:
        kind: Secret
        name: "{{ item }}"
        namespace: "{{ namespace }}"
      register: _protected_secrets
      loop:
        - ansibleaiconnect-sample-model-mesh-configuration
        - ansibleaiconnect-sample-db-fields-encryption-secret
        - ansibleaiconnect-sample-postgres-configuration
        - ansiblemcpconnect-sample-admin-password
        - auth-configuration-secret
      loop_control:
        label: "{{ item }}"

    - name: Assert GitOps, gateway, and CR-referenced Secrets kept last-applied-configuration
      ansible.builtin.assert:
        that:
          - item.resources | default([]) | length == 1
          - (item.resources[0].metadata.annotations | default({}))['kubectl.kubernetes.io/last-applied-configuration'] is defined
        fail_msg: >-
          Protected Secret {{ item.item }} lost
          kubectl.kubernetes.io/last-applied-configuration
      loop: "{{ _protected_secrets.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Assert managed_by_aap seed left encryption key unchanged
      ansible.builtin.assert:
        that:
          - item.resources[0].data.secret_key == _dbenc_before.resources[0].data.secret_key
        fail_msg: managed_by_aap seed changed db-fields-encryption-secret data
      loop: "{{ _protected_secrets.results }}"
      loop_control:
        label: "{{ item.item }}"
      when: item.item == 'ansibleaiconnect-sample-db-fields-encryption-secret'

    - name: Assert custom-manager apply left postgres data unchanged
      ansible.builtin.assert:
        that:
          - item.resources[0].data.password == _pg_before.resources[0].data.password
        fail_msg: custom-manager apply changed postgres-configuration Secret data
      loop: "{{ _protected_secrets.results }}"
      loop_control:
        label: "{{ item.item }}"
      when: item.item == 'ansibleaiconnect-sample-postgres-configuration'
      no_log: true
