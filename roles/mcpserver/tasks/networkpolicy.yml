---
- name: Apply default deny NetworkPolicy for AnsibleMCPConnect operand pods
  kubernetes.core.k8s:
    state: present
    apply: true
    definition: "{{ lookup('template', 'networking/default-deny.networkpolicy.yaml.j2') }}"

- name: Apply MCP Server NetworkPolicy
  kubernetes.core.k8s:
    state: present
    apply: true
    definition: "{{ lookup('template', 'networking/mcpserver.networkpolicy.yaml.j2') }}"
