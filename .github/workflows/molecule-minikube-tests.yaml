name: Molecule Tests (Minikube)
on:
  workflow_dispatch:

jobs:
  build:
    name: Run Molecule Tests (Minikube)
    timeout-minutes: 60
    runs-on: ubuntu-24.04
    env:
      OPERATOR_IMAGE: ${{ vars.TESTING_OPERATOR_IMAGE }}
      OPERATOR_PULL_POLICY: ${{ vars.TESTING_OPERATOR_PULL_POLICY }}
      DOCKER_API_VERSION: "1.44"

    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: '3.12'

    - name: Start minikube
      uses: medyagh/setup-minikube@latest
      with:
        addons: storage-provisioner,default-storageclass
        memory: 7800

    - name: Sleep for 3 minutes
      run: sleep 180

    - name: Install Dependencies
      run: |
        pip install --upgrade pip
        pip install -r molecule/requirements.txt

    - name: Install Collections
      run: |
        ansible-galaxy collection install -r molecule/requirements.yml

    - name: Compose the Quay pull credential
      # The scenarios create a kubernetes.io/dockerconfigjson secret so the pods can pull
      # quay.io/ansible/ansible-ai-connect-service, which is private. Derive it from the
      # robot account the publish workflows already use, rather than keeping a separate
      # static copy of someone's ~/.docker/config.json as a repository secret.
      run: |
        AUTH=$(printf '%s' "${QUAY_USER}:${QUAY_TOKEN}" | base64 -w0)
        CONFIG=$(printf '{"auths":{"quay.io":{"auth":"%s"}}}' "$AUTH" | base64 -w0)
        # This value is derived at runtime, so it is not a registered repository secret
        # and GitHub will not redact it by itself. Mask both forms before anything can
        # print the Secret that carries them.
        echo "::add-mask::$AUTH"
        echo "::add-mask::$CONFIG"
        printf 'DOCKER_CONFIG_JSON=%s\n' "$CONFIG" >> "$GITHUB_ENV"
      env:
        QUAY_USER: ${{ secrets.QUAY_USER }}
        QUAY_TOKEN: ${{ secrets.QUAY_TOKEN }}

    - name: Run Molecule
      env:
        MOLECULE_VERBOSITY: 0
        PY_COLORS: '1'
        ANSIBLE_FORCE_COLOR: '1'
      run: |
        sudo rm -f $(which kustomize)
        make kustomize
        KUSTOMIZE_PATH=$(readlink -f bin/kustomize) molecule test

    - name: Report to slack
      id: slack
      uses: slackapi/slack-github-action@v1.23.0
      with:
        payload: |
          {
            "text": "Lightspeed Operator Molecule Tests (Minikube): ${{ job.status }}\nLink: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          }
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
      if: ${{ always() }}
