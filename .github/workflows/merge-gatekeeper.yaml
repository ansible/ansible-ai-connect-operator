---
name: Merge Gatekeeper

on:
  pull_request:
    branches:
      - main

jobs:
  merge-gatekeeper:
    runs-on: ubuntu-24.04
    permissions:
      checks: read
      statuses: read
    steps:
      - name: Run Merge Gatekeeper
        uses: upsidr/merge-gatekeeper@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          interval: 60
          # Kind molecule is regularly ~18-22m; leftover-strip coverage
          # added another reconcile. 20m was racing a green molecule job.
          timeout: 2400
